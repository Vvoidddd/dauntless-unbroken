# Dependency update pull requests, kept few:
#  - GitHub Actions: weekly, every update in one pull request (the actions stay pinned by commit).
#  - npm: monthly for each package folder; minor and patch updates of a folder come as one pull request.
#    Major updates are never grouped: each one (Electron's included) is its own pull request, so it can be
#    tested on its own.
# A release has to be at least a week old before it is proposed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /DauntlessUnbrokenMetagame
    schedule:
      interval: monthly
    # This alias preserves the JS Compiler API used by the branding AST audit.
    ignore:
      - dependency-name: typescript-api
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      metagame-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /DauntlessUnbrokenGateway
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      gateway-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /DauntlessUnbrokenContent
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      content-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /DauntlessUnbrokenDeployServer
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      deployserver-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /DauntlessUnbrokenLauncher
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      launcher-minor-and-patch:
        update-types:
          - minor
          - patch
