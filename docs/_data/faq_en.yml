# Player FAQ. Keep q/a blocks compatible with tools/build-llms.js.
- id: can-you-still-play-dauntless
  q: "How do I play Dauntless Unbroken?"
  a: >-
    Install the [latest launcher](https://github.com/Vvoidddd/dauntless-unbroken/releases/latest),
    obtain a realm account key and follow [Start playing](setup/index.md). Dauntless Unbroken uses
    the supported Dauntless 1.4.4 client and a community-operated backend.

- id: which-version
  q: "Can I use an existing game installation?"
  a: >-
    The launcher searches for compatible 1.4.4 installations and shows the folder for your confirmation.
    Other client versions cannot use the native integration. Repair verifies the selected files;
    see [file verification](findings/verification.md).

- id: account-key
  q: "Where is my account key saved?"
  a: >-
    After successful online sign-in, the launcher automatically saves a recovery key file to your
    Desktop and keeps encrypted local storage. If automatic saving fails, use manual export.
    Keep the key private: it grants access to your account.

- id: multiplayer
  q: "How do parties and hunt queues work?"
  a: >-
    The party follows its leader's selected region. A group shares one hunt instance. When capacity
    is unavailable, matchmaking waits for admission; repeated retries do not create more capacity.
    See [server architecture](server.md#hunts-and-capacity).

- id: offline
  q: "Does Offline mode affect my online save?"
  a: >-
    No. Offline mode uses a separate local save and does not upload it into the online realm.
    Online accounts and progression are stored by the server.

- id: how-do-i-host-my-own
  q: "How do I host a server?"
  a: >-
    Start with [server architecture](server.md), then choose the platform-specific setup guide.
    Keep deployment and database services private. Public players connect through the TLS gateway;
    do not expose unauthenticated internal listeners.

- id: licenses
  q: "Where are the source and license notices?"
  a: >-
    The [legal page](legal.md) records software licenses and source provenance. The repository is
    available at [Vvoidddd/dauntless-unbroken](https://github.com/Vvoidddd/dauntless-unbroken).
    Dauntless Unbroken has no hosting-provider partnerships.
