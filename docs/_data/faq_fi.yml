# Pelaajien usein kysytyt kysymykset.
- id: pelaaminen
  q: "Miten aloitan pelaamisen?"
  a: >-
    Asenna [uusin käynnistin](https://github.com/Vvoidddd/dauntless-unbroken/releases/latest),
    hanki palvelimen tiliavain ja seuraa [aloitusohjetta](setup/index.md).
    Dauntless Unbroken käyttää tuettua Dauntless 1.10.5 -asiakasohjelmaa.

- id: pelitiedostot
  q: "Voinko käyttää olemassa olevaa peliasennusta?"
  a: >-
    Käynnistin etsii yhteensopivia asennuksia ja pyytää vahvistamaan kansion ennen sen käyttöönottoa.
    Korjaus tarkistaa tiedostot. Muut peliversiot eivät toimi tämän integraation kanssa.

- id: tiliavain
  q: "Mihin tiliavain tallennetaan?"
  a: >-
    Onnistuneen verkkokirjautumisen jälkeen käynnistin tallentaa palautusavaimen automaattisesti
    työpöydälle ja säilyttää salatun paikallisen kopion. Jos tallennus epäonnistuu, käytä
    manuaalista vientiä. Pidä avain yksityisenä.

- id: offline
  q: "Voiko versiota 1.10.5 pelata offline-tilassa?"
  a: >-
    Ei vielä. Version 1.10.5 offline-peli ei ole vielä saatavilla.

- id: palvelin
  q: "Miten palvelin toimii?"
  a: >-
    [Palvelinopas](server.md) selittää osat, verkkorajat, tallennukset ja metsästysjonot.
    Sisäisiä käyttöönotto- ja tietokantapalveluita ei saa avata julkiseen verkkoon.

- id: lisenssit
  q: "Mistä löytyvät lisenssitiedot?"
  a: >-
    [Lakiasiat](legal.md) sisältää ohjelmistojen lisenssit ja lähdetiedot.
    Dauntless Unbrokenilla ei ole hosting-kumppanuuksia.
